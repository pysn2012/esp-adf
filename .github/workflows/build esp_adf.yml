# ------------------------------------------------------------------
# 工作流名称：手动触发，为 ADF 音频板编译 MicroPython 固件（单 Job 版）
# ------------------------------------------------------------------
name: ESP32 ADF MicroPython Build

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ESP_IDF_VERSION: v5.2.2
  MICROPYTHON_COMMIT: 5114f2c1ea7c05fc7ab920299967595cfc5307de
  ESP_IDF_DIR: ${{ github.workspace }}/esp-idf
  MICROPYTHON_DIR: ${{ github.workspace }}/micropython
  ADF_BOARDS_DIR: ${{ github.workspace }}/micropython_adf/boards
  ADF_MOD_DIR: ${{ github.workspace }}/micropython_adf/mod
  ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
  ADF_PATH: ${{ github.workspace }}

jobs:
  build-adf-boards:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board_dir:
          - lyrat43
          - korvo2v3

    steps:
      # 1. 检出当前仓库（包含 micropython_adf/）
      - name: 检出本仓库
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 安装系统依赖
      - name: 安装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git wget flex bison gperf python3 python3-pip python3-venv \
            cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      # 3. 清理并克隆指定版本 ESP-IDF
      - name: 克隆 ESP-IDF
        run: |
          rm -rf ${{ env.ESP_IDF_DIR }}
          git clone --depth=1 --branch=${{ env.ESP_IDF_VERSION }} \
            https://github.com/espressif/esp-idf.git ${{ env.ESP_IDF_DIR }}
          cd ${{ env.ESP_IDF_DIR }}
          git submodule update --init --recursive --filter=tree:0

      # 4. 安装 ESP-IDF 工具链和 Python 虚拟环境
      - name: 安装 ESP-IDF 环境
        run: |
          cd ${{ env.ESP_IDF_DIR }}
          ./install.sh esp32,esp32s3

      # 5. 检出 MicroPython（带 ADF 支持）
      - name: 检出 MicroPython
        run: |
          git clone https://github.com/micropython/micropython.git ${{ env.MICROPYTHON_DIR }}
          cd ${{ env.MICROPYTHON_DIR }}
          git fetch origin ${{ env.MICROPYTHON_COMMIT }}:feature/support_adf
          git checkout feature/support_adf
          git submodule update --init --recursive --depth 1

      # 6. 应用补丁
      - name: 应用 MicroPython 和 IDF 补丁
        run: |
          # MicroPython 补丁
          cd ${{ env.MICROPYTHON_DIR }}
          git apply $GITHUB_WORKSPACE/micropython_adf/mp.diff

          # 移除冲突文件
          rm -f ${{ env.ESP_IDF_DIR }}/components/fatfs/CMakeLists.txt

          # IDF 补丁
          cd ${{ env.ESP_IDF_DIR }}
          git apply $GITHUB_WORKSPACE/idf_patches/idf_v5.2_freertos.patch

      # 7. 构建当前板子固件
      - name: 编译 ${{ matrix.board_dir }} 固件
        run: |
          # 激活 ESP-IDF 环境（关键！）
          source ${{ env.ESP_IDF_DIR }}/export.sh

          cd ${{ env.MICROPYTHON_DIR }}/ports/esp32
          idf.py build \
            -D MICROPY_BOARD_DIR="${{ env.ADF_BOARDS_DIR }}/${{ matrix.board_dir }}" \
            -D USER_C_MODULES="${{ env.ADF_MOD_DIR }}/micropython.cmake"

      # 7.5. 合成完整的 firmware.bin
      - name: 合成 ${{ matrix.board_dir }} 完整固件
        run: |
          source ${{ env.ESP_IDF_DIR }}/export.sh

          BUILD_DIR="${{ env.MICROPYTHON_DIR }}/ports/esp32/build"
          FW_OUTPUT="${{ env.MICROPYTHON_DIR }}/ports/esp32/build/firmware.bin"

          esptool.py --chip esp32 merge_bin -o "$FW_OUTPUT" \
            --flash_mode dio --flash_freq 40m --flash_size 8MB \
            0x0 "$BUILD_DIR/bootloader/bootloader.bin" \
            0x8000 "$BUILD_DIR/partition_table/partition-table.bin" \
            0x10000 "$BUILD_DIR/micropython.bin"

          echo "✅ 完整固件已合成: $FW_OUTPUT"

      # 8. 收集并上传固件
      - name: 收集并上传固件
        run: |
          mkdir -p ${{ env.ARTIFACTS_DIR }}
          FW_SRC="${{ env.MICROPYTHON_DIR }}/ports/esp32/build/firmware.bin"
          FW_DST="${{ env.ARTIFACTS_DIR }}/${{ matrix.board_dir }}.bin"
          if [[ -f "$FW_SRC" ]]; then
            cp "$FW_SRC" "$FW_DST"
          else
            echo "❌ 固件未生成: $FW_SRC"
            exit 1
          fi

      - name: 上传 ${{ matrix.board_dir }} 固件
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board_dir }}
          path: ${{ env.ARTIFACTS_DIR }}/${{ matrix.board_dir }}.bin