# ------------------------------------------------------------------
# 工作流名称：手动触发，为 ADF 支持的 ESP32 音频板编译 MicroPython 固件
# ------------------------------------------------------------------
name: ESP32 ADF MicroPython Build

# 触发方式：仅手动
on:
  workflow_dispatch:

# 并发控制：同一分支只保留最新一次运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 全局环境变量
env:
  ESP_IDF_VERSION: v5.0.4
  MICROPYTHON_COMMIT: 5114f2c1ea7c05fc7ab920299967595cfc5307de
  ESP_IDF_DIR: ${{ github.workspace }}/esp-idf
  MICROPYTHON_DIR: ${{ github.workspace }}/micropython
  ADF_BOARDS_DIR: ${{ github.workspace }}/micropython_adf/boards
  ADF_MOD_DIR: ${{ github.workspace }}/micropython_adf/mod
  ARTIFACTS_DIR: ${{ github.workspace }}/artifacts

jobs:
  # ----------------------------------------------------------------
  # 1) 准备环境：检出代码 + 安装 IDF + 应用补丁
  # ----------------------------------------------------------------
  setup-environment:
    runs-on: ubuntu-24.04
    steps:
      # 1.1 检出当前仓库（包含 micropython_adf 目录）
      - name: 检出本仓库
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1.2 安装系统依赖
      - name: 安装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git wget flex bison gperf python3 python3-pip python3-venv \
            cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      # 1.3 克隆指定版本 ESP-IDF
      - name: 克隆 ESP-IDF
        run: |
          git clone --depth=1 --branch=${{ env.ESP_IDF_VERSION }} \
            https://github.com/espressif/esp-idf.git ${{ env.ESP_IDF_DIR }}
          cd ${{ env.ESP_IDF_DIR }}
          git submodule update --init --recursive --filter=tree:0

      # 1.4 安装 ESP-IDF 工具链（支持 esp32/esp32s3）
      - name: 安装 ESP-IDF 工具链
        run: |
          cd ${{ env.ESP_IDF_DIR }}
          ./install.sh esp32,esp32s3

      # 1.5 检出指定 MicroPython 提交（带 ADF 分支特性）
      - name: 检出 MicroPython
        run: |
          git clone https://github.com/micropython/micropython.git ${{ env.MICROPYTHON_DIR }}
          cd ${{ env.MICROPYTHON_DIR }}
          git fetch origin ${{ env.MICROPYTHON_COMMIT }}:feature/support_adf
          git checkout feature/support_adf
          git submodule update --init --recursive --depth 1

      # 1.6 应用 MicroPython ADF 补丁
      - name: 应用 MicroPython ADF 补丁
        run: |
          cd ${{ env.MICROPYTHON_DIR }}
          git apply $GITHUB_WORKSPACE/micropython_adf/mp.diff

      # 1.7 移除冲突文件（避免构建错误）
      - name: 移除冲突的 CMakeLists.txt
        run: |
          rm -f ${{ env.ESP_IDF_DIR }}/components/fatfs/CMakeLists.txt

      # 1.8 应用 IDF 补丁
      - name: 应用 ESP-IDF 补丁
        run: |
          cd ${{ env.ESP_IDF_DIR }}
          git apply $GITHUB_WORKSPACE/idf_patches/idf_v5.0_freertos.patch

  # ----------------------------------------------------------------
  # 2) 并行构建 ADF 支持的音频开发板固件
  # ----------------------------------------------------------------
  build:
    needs: setup-environment
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board_dir:
          - lyrat43
          - korvo2v3
          - lyratmini

    steps:
      # 2.1 恢复工作区（确保所有文件存在）
      - name: 检出本仓库（恢复 micropython_adf 等）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2.2 导入 ESP-IDF 环境
      - name: 导入 ESP-IDF 环境
        run: |
          source ${{ env.ESP_IDF_DIR }}/export.sh

      # 2.3 编译固件（使用 CMake 构建系统）
      - name: 编译 ${{ matrix.board_dir }} 固件
        run: |
          source ${{ env.ESP_IDF_DIR }}/export.sh
          cd ${{ env.MICROPYTHON_DIR }}/ports/esp32
          idf.py build \
            -D MICROPY_BOARD_DIR="${{ env.ADF_BOARDS_DIR }}/${{ matrix.board_dir }}" \
            -D USER_C_MODULES="${{ env.ADF_MOD_DIR }}/micropython.cmake"

      # 2.4 重命名并收集固件
      - name: 收集固件
        run: |
          mkdir -p ${{ env.ARTIFACTS_DIR }}
          FW_SRC="${{ env.MICROPYTHON_DIR }}/ports/esp32/build/firmware.bin"
          FW_DST="${{ env.ARTIFACTS_DIR }}/${{ matrix.board_dir }}.bin"
          if [[ -f "$FW_SRC" ]]; then
            cp "$FW_SRC" "$FW_DST"
          else
            echo "固件未找到: $FW_SRC"
            exit 1
          fi

      # 2.5 上传固件
      - name: 上传 ${{ matrix.board_dir }} 固件
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.board_dir }}
          path: ${{ env.ARTIFACTS_DIR }}/${{ matrix.board_dir }}.bin